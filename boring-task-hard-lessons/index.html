  <footer class="bar">

    <div class="progress" id="progress"><div></div></div>
    <span class="counter" id="counter"></span>
  </footer>
  <script>
    const slides = [...document.querySelectorAll('.slide')];
    const counter = document.getElementById('counter');
    const bar = document.querySelector('#progress div');
    let cur = 0;
    function show(n) {
      cur = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach((s, i) => s.classList.toggle('active', i === cur));
      counter.textContent = (cur + 1) + ' / ' + slides.length;
      bar.style.width = ((cur + 1) / slides.length * 100) + '%';
      history.replaceState(null, '', '#' + (cur + 1));
    }
    const next = () => show(cur + 1), prev = () => show(cur - 1);
    document.querySelector('.next').onclick = next;
    document.querySelector('.prev').onclick = prev;
    document.getElementById('progress').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      show(Math.floor((e.clientX - r.left) / r.width * slides.length));
    };
    document.getElementById('fs').onclick = toggleFs;
    function toggleFs() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
    document.addEventListener('keydown', e => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); next(); }
      else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
      else if (e.key === 'Home') show(0);
      else if (e.key === 'End') show(slides.length - 1);
      else if (e.key === 'f' || e.key === 'F') toggleFs();
    });
    let tx = null;
    document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
      if (tx === null) return;
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
      tx = null;
    });
    show((parseInt(location.hash.slice(1)) || 1) - 1);
  </script>
